version: '3.9'

# Development override — hot reload, exposed ports, no nginx
services:
  postgres:
    image: postgres:16-alpine
    container_name: agrovet-postgres-dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agrovet
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agrovet-redis-dev
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data

  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: agrovet-openwa-dev
    ports:
      - '2785:2785'
    volumes:
      - openwa_sessions_dev:/app/sessions

volumes:
  postgres_data_dev:
  redis_data_dev:
  openwa_sessions_dev:
